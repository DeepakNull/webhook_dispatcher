services:
  postgres:
    image: postgres:16
    container_name: wd_postgres
    environment:
      POSTGRES_USER: dispatcher
      POSTGRES_PASSWORD: dispatcher
      POSTGRES_DB: dispatcher
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U dispatcher" ]
      interval: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: wd_rabbitmq
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI (guest / guest)
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      retries: 5

volumes:
  pgdata:
  rabbitdata:
